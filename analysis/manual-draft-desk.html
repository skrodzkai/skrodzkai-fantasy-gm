<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>SKRODZKai · Draft Desk</title><style>
/* Wordmark: app components/layout/AppShell.tsx. Palette: lib/design-tokens.ts. */
:root{color-scheme:dark;--bg:#06080c;--panel:#12151e;--line:rgba(255,255,255,.10);--muted:#8fa3bd;--blue:#29b6ff;--cyan:#8ed8ff;--ink:#f2f6fb;--warn:#f59e0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 'DM Sans','SF Pro Text',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 9px;min-height:32px}button{cursor:pointer}button:hover{border-color:var(--blue)}:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
header{height:48px;padding:0 16px;display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--line)}.wordmark{font-size:21px;font-weight:900;letter-spacing:.06em;line-height:1;white-space:nowrap;color:#f3f8fe}.wordmark span{color:#29b6ff}.desk-label{color:var(--muted);font-size:12px}.identity{margin-left:auto;color:var(--muted);font-size:12px}
main{padding:0 16px 16px}.navrow{display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);margin-bottom:12px;min-height:44px}nav{display:flex;gap:4px}nav button{border:0;background:none;border-radius:0;min-height:42px;color:var(--muted);padding:8px 12px}nav button[aria-pressed=true]{color:var(--blue);box-shadow:inset 0 -2px var(--blue)}.receipt{margin-left:auto;color:var(--muted);font-size:11px;display:flex;gap:12px;flex-wrap:wrap}.warn{color:var(--warn)}[hidden]{display:none!important}
h1,h2,h3,h4,p{margin:0}h2{font-size:18px}h3{font-size:20px}h4{font-size:12px;font-weight:600;margin:14px 0 6px}.muted,small{color:var(--muted)}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:8px}.toolbar input{width:260px;max-width:40vw}.count{margin-left:auto;color:var(--muted);font-size:11px}.tablewrap{overflow:auto;max-height:calc(100vh - 160px);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;white-space:nowrap}th{position:sticky;top:0;z-index:1;background:var(--panel);font-size:11px;font-weight:600;text-align:left;color:var(--muted)}th,td{padding:5px 10px;height:32px;border-bottom:1px solid var(--line)}tbody tr:hover{background:rgba(41,182,255,.045)}.num{text-align:right}.namecell{max-width:270px}.player{display:block;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:none;padding:0;min-height:22px;text-align:left}.player:hover{color:var(--blue)}.statuscell{max-width:180px;overflow:hidden;text-overflow:ellipsis;font-size:11px;color:var(--warn)}.value{font-weight:600}.position{color:var(--cyan);font-size:11px}.nfl{color:var(--muted);font-size:11px}
.section-heading{display:flex;align-items:center;gap:14px;margin-bottom:12px}.section-heading small{margin-left:auto}.scout-layout{display:grid;grid-template-columns:minmax(260px,1fr) minmax(440px,2fr);gap:20px}.team-grid{display:grid;gap:6px;grid-template-columns:repeat(2,minmax(0,1fr));align-content:start}.team-card{padding:9px 10px;text-align:left;background:transparent;min-width:0}.team-card strong,.team-card small,.team-card span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.team-card strong{font-size:12px;margin:3px 0}.team-card small,.team-card span{font-size:11px;color:var(--muted)}.team-card[aria-pressed=true]{background:rgba(41,182,255,.08);border-color:rgba(41,182,255,.5);box-shadow:inset 2px 0 var(--blue)}.team-card[aria-pressed=true] small{color:var(--cyan)}.scout-detail{padding-left:20px;border-left:1px solid var(--line);min-width:0}.owner-meta{font-size:11px;color:var(--muted);margin:5px 0 12px}.owner-summary{font-size:13px;line-height:1.65;max-width:850px;margin:10px 0}.opening{font-size:12px;color:var(--muted)}.scout-metrics{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:6px;margin:8px 0 12px}.scout-metric{padding:7px 8px;border-right:1px solid var(--line)}.scout-metric:last-child{border:0}.scout-metric strong{display:block;font-size:18px;line-height:1.4}.scout-metric small{font-size:10px}.order-context{border-left:2px solid var(--blue);padding:7px 10px;background:rgba(41,182,255,.035);font-size:12px;line-height:1.6;margin:12px 0}.round-control{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
details{margin-top:10px}summary{cursor:pointer;color:var(--cyan);padding:4px 0;font-size:12px}.evidence-table{white-space:normal;font-size:12px}.evidence-table th{position:static}.evidence-table td{line-height:1.6}.order-layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px}.order-fields{display:grid;gap:6px;margin-top:12px}.order-field{display:flex;align-items:center;justify-content:space-between;gap:8px}.order-field span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.order-field select{width:115px;flex-shrink:0}.order-actions{display:flex;align-items:center;gap:12px;margin-top:12px}.primary{background:var(--blue);color:var(--bg);font-weight:600}.order-guide p{margin:8px 0 12px;line-height:1.6}.order-table td:last-child{white-space:normal;font-size:12px;min-width:200px}.inline-note{font-size:12px;color:var(--muted);margin:6px 0}.error{font-size:12px;color:var(--warn);margin:6px 0}.error:empty{display:none}
dialog{max-width:580px;width:calc(100% - 32px);background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:20px}dialog::backdrop{background:#000b}pre{white-space:pre-wrap;font:12px/1.6 system-ui,sans-serif}dialog form{text-align:right}
th[data-sort]{cursor:pointer}th button{border:0;background:none;padding:0;min-height:22px;width:100%;text-align:inherit;font:inherit;color:inherit}th[aria-sort=ascending],th[aria-sort=descending]{color:var(--blue)}th[aria-sort=ascending] button::after{content:' ↑'}th[aria-sort=descending] button::after{content:' ↓'}
@media(max-width:900px){.scout-layout{grid-template-columns:1fr}.scout-detail{border-left:0;padding:12px 0 0;border-top:1px solid var(--line)}.team-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.order-layout{grid-template-columns:1fr}.receipt{gap:4px}.identity{font-size:10px}.scout-metrics{grid-template-columns:repeat(7,minmax(65px,1fr));overflow:auto}}
@media(max-width:600px){header{padding:0 10px;gap:10px}.wordmark{font-size:18px}.desk-label{display:none}main{padding:0 10px 12px}.navrow{flex-wrap:wrap;gap:0;padding-bottom:6px}.receipt{margin-left:0}.toolbar{flex-wrap:wrap}.toolbar input{max-width:none;flex:1}.count{width:100%}.team-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tablewrap{max-height:calc(100vh - 220px)}}
@media print{nav,.toolbar,.order-fields,.order-actions{display:none}.tablewrap{max-height:none;overflow:visible}body{background:white;color:black}}
</style></head><body>
<header><div class="wordmark" aria-label="SKRODZKai">SKRODZK<span>ai</span></div><h1 class="desk-label">Draft Desk</h1><span class="identity" id="identity"></span></header>
<main><div class="navrow"><nav aria-label="Draft Desk sections"><button data-view="board" aria-pressed="true" aria-controls="board">Player board</button><button data-view="scouting" aria-pressed="false" aria-controls="scouting">Opponents</button><button data-view="order" aria-pressed="false" aria-controls="order">Draft order</button></nav><div class="receipt"><span id="snapshot"></span><span id="health" role="status"></span><span>Offline reference</span></div></div>
<p class="error" id="message" role="alert"></p>
<section id="board" aria-label="Player board"><div class="toolbar"><input id="search" type="search" aria-label="Search player or NFL team" placeholder="Player or team…"><select id="position" aria-label="Position"><option>ALL</option><option value="FLEX">WR / RB / TE</option><option>QB</option><option>RB</option><option>WR</option><option>TE</option><option>K</option><option>DEF</option><option>IDP</option><option>LB</option><option>CB</option><option>S</option><option>DL</option></select><select id="sort" aria-label="Sort players"><option value="value">Value over replacement</option><option value="points">Projected points</option></select><span class="count" id="rows"></span></div>
<div class="tablewrap"><table><thead><tr><th data-sort="name"><button>Player</button></th><th data-sort="position"><button>Pos</button></th><th data-sort="team"><button>NFL</button></th><th data-sort="health"><button>Health / review</button></th><th data-sort="value" class="num" title="Projected value above replacement"><button>Value +/−</button></th><th data-sort="points" class="num" title="Custom league-scored projection, fantasy weeks 1–17"><button>Points</button></th><th data-sort="adp" class="num" title="Sort by market average draft position; range shown below on player details"><button>ADP</button></th><th data-sort="bye" class="num"><button>Bye</button></th></tr></thead><tbody id="players"></tbody></table></div></section>
<section id="scouting" aria-labelledby="scoutingTitle" hidden><div class="section-heading"><h2 id="scoutingTitle">Opponent scouting</h2><label class="round-control">Planning round <select id="planningRound" aria-label="Planning round"></select></label><small id="opponentCount"></small></div><div class="scout-layout"><div class="team-grid" id="opponentTeams" role="group" aria-label="Choose an opponent"></div><section class="scout-detail" id="opponentDetail" aria-label="Selected opponent summary" aria-live="polite" aria-atomic="true"></section></div></section>
<section id="order" aria-labelledby="orderTitle" hidden><div class="order-layout"><div><h2 id="orderTitle">Actual draft order</h2><p class="inline-note">Set once when Yahoo releases the order. No pick entry during the draft.</p><div class="order-fields" id="orderFields"></div><div class="order-actions"><button class="primary" id="saveOrder">Save order</button><small id="orderStatus"></small></div></div><section class="order-guide" aria-label="Snake draft game plan"><h2>Your snake turns</h2><div id="strategy"></div></section></div></section>
</main><dialog id="details"><h2 id="detailName"></h2><pre id="detailBody"></pre><form method="dialog"><button>Close</button></form></dialog>
<script>
/*MODEL*/
const packet = /*PACKET*/;
const $=id=>document.getElementById(id), text=(tag,value,cls)=>{const el=document.createElement(tag);el.textContent=value;if(cls)el.className=cls;return el;}, num=n=>typeof n==='number'&&Number.isFinite(n)?n.toFixed(1):'—';
const opponents=packet.opponents||[], key=`skrodzkai-draft-order:${packet.leagueId}:${packet.scoringModel}`;
let order={}, selected=opponents[0]||null, sortKey='value', sortDirection='desc';
for(const [value,label] of Object.entries({name:'Player name',position:'Position',team:'NFL team',health:'Health status',adp:'Average draft position',bye:'Bye week'}))$('sort').append(new Option(label,value));
function message(value){$('message').textContent=value;}
try{const saved=localStorage.getItem(key);if(saved)order=validateOrder(JSON.parse(saved),packet);}catch{message('Saved order could not be read. Seats are unassigned; enter the actual order in Draft order.');}
$('identity').textContent=`${packet.leagueId==='420010'?'2 Minute Drillers':'League Two · TEST'} · ${packet.teams} teams · ${packet.rounds} rounds`;
$('snapshot').textContent=`Snapshot ${new Date(packet.observedAt).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}`;
function renderHealth(){const ready=boardReady(packet);$('health').textContent=ready?'Data review passed':packet.health==='PASS'?'Status check due':'Data review not passed';$('health').className=ready?'':'warn';$('health').title=packet.notice;}
for(const button of document.querySelectorAll('[data-view]'))button.onclick=()=>{for(const b of document.querySelectorAll('[data-view]')){const active=b===button;b.setAttribute('aria-pressed',String(active));$(b.dataset.view).hidden=!active;}};
function renderBoard(){
 const players=rankedPlayers(packet,{position:$('position').value,search:$('search').value,sort:sortKey,direction:sortDirection});$('rows').textContent=`${players.length} players · details on click`;
 for(const th of document.querySelectorAll('[data-sort]'))th.setAttribute('aria-sort',th.dataset.sort===sortKey?(sortDirection==='asc'?'ascending':'descending'):'none');
 $('players').replaceChildren(...players.map(p=>{
  const row=document.createElement('tr'),name=text('td','','namecell'),button=text('button',p.name,'player');button.title=p.name;button.onclick=()=>showDetails(p);name.append(button);
  const health=text('td',healthMarker(p),'statuscell');health.title=p.injury?.blockReason||p.injury?.status||'See player details';
  row.append(name,text('td',p.position,'position'),text('td',p.team,'nfl'),health,text('td',num(p.vor),'num value'),text('td',num(p.projection),'num'),text('td',num(p.marketAdp),'num'),text('td',p.bye??'—','num'));return row;
 }));
}
function showDetails(p){$('detailName').textContent=p.name;$('detailBody').textContent=`${p.team} · Eligible: ${p.eligible.join(', ')}\nValue above replacement: ${num(p.vor)}\nCustom points, weeks 1–17: ${num(p.projection)}\nFull-season source consensus: ${num(p.sourceSeasonProjection)}\nADP: ${num(p.marketAdp)} · Draft range: ${num(p.adpLow)}–${num(p.adpHigh)}\n${p.marketAdp==null?'No matched ADP in this feed.\n':''}\n${injuryNotes(p)}\n\nValidation: ${p.validationStatus??'UNREVIEWED'}\n${p.idpModelWarning??''}\n${p.notes??''}`;$('details').showModal();}
function orderContext(card,round){
 const ours=order.ours,theirs=order[card.managerId];if(!ours||!theirs)return 'Draft-order context awaits your seat and this owner’s seat.';
 if(round===packet.rounds)return `Final round: your pick #${nextTurns(ours,1,packet.teams,packet.rounds)[round-1]}; their pick #${nextTurns(theirs,1,packet.teams,packet.rounds)[round-1]}.`;
 const between=opponentBetween(card,order,round,packet),windows=[];
 for(const pos of SCOUT_POSITIONS){const recent=card.specialty[pos].recent,rounds=new Set(between.map(p=>Math.ceil(p/packet.teams))),hits=recent.filter(x=>x.round!==null&&rounds.has(x.round)).length;if(hits)windows.push(`${pos} ${hits}/${recent.length}`);}
 return `${card.teamName} has ${between.length} selection${between.length===1?'':'s'} between your R${round} and R${round+1} turns${between.length?` (#${between.join(', #')})`:''}.${windows.length?` First-position picks in those rounds, 2021–2025: ${windows.join(' · ')}.`:''} Historical timing, not a prediction of available players.`;
}
function selectOpponent(card){
 selected=card;for(const b of $('opponentTeams').children)b.setAttribute('aria-pressed',String(b.dataset.teamId===card.teamId));const summary=opponentSummary(card),panel=$('opponentDetail');panel.replaceChildren(text('h3',card.teamName),text('p',`${card.managerId} · ${card.seasons.length} seasons · ${card.rows} picks · ${order[card.managerId]?`Seat ${order[card.managerId]}`:'Seat unassigned'}`,'owner-meta'));
 panel.append(text('p',card.summary?card.summary.join(' '):summary.headline,'owner-summary'),text('p',`Round 1, 2021–2025: ${summary.detail}`,'opening'),text('p',`First four rounds: ${Object.entries(card.recentOpening).map(([pos,n])=>`${pos} ${n}`).join(' · ')}`,'opening'),text('h4','First player at each position · historical median'));
 const metrics=text('div','','scout-metrics');for(const pos of SCOUT_POSITIONS){const item=card.specialty[pos],metric=text('div','','scout-metric');metric.append(text('small',pos),text('strong',item.medianRound===null?'—':`R${item.medianRound}`),text('small',`${item.draftedSeasons} drafts`));metrics.append(metric);}panel.append(metrics,text('p',orderContext(card,Number($('planningRound').value)),'order-context'));
 const evidence=document.createElement('details');evidence.append(text('summary','Recent first-pick timing'));const table=text('table','','evidence-table'),head=document.createElement('thead'),tr=document.createElement('tr');for(const label of ['Position','First selection by season']){const th=text('th',label);th.scope='col';tr.append(th);}head.append(tr);table.append(head);const body=document.createElement('tbody');
 for(const pos of SCOUT_POSITIONS){const row=document.createElement('tr');row.append(text('td',pos),text('td',card.specialty[pos].recent.map(x=>`${x.season}: ${x.round===null?'not drafted':`R${x.round}`}`).join(' · ')||'No recent sample'));body.append(row);}table.append(body);evidence.append(table);panel.append(evidence);
}
function renderCards(){
 $('opponentCount').textContent=`${opponents.length} opponents · 2011–2025`;
 $('opponentTeams').replaceChildren(...opponents.map(card=>{const b=text('button','','team-card');b.type='button';b.dataset.teamId=card.teamId;b.setAttribute('aria-controls','opponentDetail');b.setAttribute('aria-pressed','false');b.append(text('small',`${card.managerId}${order[card.managerId]?` · Seat ${order[card.managerId]}`:''}`),text('strong',card.teamName),text('span',opponentSummary(card).headline));b.onclick=()=>selectOpponent(card);return b;}));
 if(selected)selectOpponent(selected);else $('opponentDetail').replaceChildren(text('p','No opponent history in this export.','muted'));
}
for(let r=1;r<=packet.rounds;r++)$('planningRound').append(new Option(`R${r}`,r));$('planningRound').onchange=()=>{if(selected)selectOpponent(selected);};
for(const owner of [{managerId:'ours',teamName:'SKRODZKai'},...opponents]){const label=text('label','','order-field'),select=document.createElement('select');select.dataset.owner=owner.managerId;select.setAttribute('aria-label',`Snake seat for ${owner.teamName}`);select.append(new Option('Unassigned',''));for(let n=1;n<=packet.teams;n++)select.append(new Option(`Seat ${n}`,n));select.value=order[owner.managerId]??'';label.append(text('span',owner.teamName),select);$('orderFields').append(label);}
function renderStrategy(){
 const panel=$('strategy');panel.replaceChildren();if(!order.ours){panel.append(text('p','Choose your actual snake seat to see your picks and the opponents between turns.','muted'));return;}
 const turns=nextTurns(order.ours,1,packet.teams,packet.rounds),assigned=Object.fromEntries(Object.entries(order).map(([owner,seat])=>[seat,owner])),names=new Map(opponents.map(c=>[c.managerId,c.teamName]));
 panel.append(text('p',order.ours===1||order.ours===packet.teams?'At the turn, evaluate both picks together. Compare the best values across positions before the long wait back; history informs competition, not a reason to reach.':'Compare best value across positions at each turn. The wait alternates in a snake draft; do not lock positions to rounds. Use opponent timing to judge competition, not to inflate player projections.'));
 const table=text('table','','order-table'),head=document.createElement('thead'),tr=document.createElement('tr');for(const s of ['Round','Your pick','Picks until next turn','Opponents selecting in between'])tr.append(text('th',s));head.append(tr);table.append(head);const body=document.createElement('tbody');
 turns.forEach((pick,i)=>{const row=document.createElement('tr'),counts=new Map();if(i+1<turns.length)for(let n=pick+1;n<turns[i+1];n++){const seat=seatAt(n,packet.teams);counts.set(seat,(counts.get(seat)||0)+1);}const labels=[...counts].map(([seat,count])=>`${names.get(assigned[seat])||`Seat ${seat} · unassigned`}${count===2?' ×2':''}`);row.append(text('td',`R${i+1}`),text('td',`#${pick}`),text('td',i+1<turns.length?turns[i+1]-pick-1:'—'),text('td',labels.join(' · ')||(i+1===turns.length?'Final selection':'Back-to-back picks')));body.append(row);});table.append(body);panel.append(table);
}
$('saveOrder').onclick=()=>{try{const candidate={};for(const select of $('orderFields').querySelectorAll('select'))if(select.value)candidate[select.dataset.owner]=Number(select.value);order=validateOrder(candidate,packet);message('');try{localStorage.setItem(key,JSON.stringify(order));$('orderStatus').textContent='Saved on this browser';}catch{$('orderStatus').textContent='This tab only';message('Browser storage unavailable. Draft order will not survive closing this tab.');}renderCards();renderStrategy();}catch(e){message(e.message);}};
for(const id of ['search','position'])$(id).addEventListener('input',renderBoard);
$('sort').onchange=()=>{sortKey=$('sort').value;sortDirection=['value','points'].includes(sortKey)?'desc':'asc';renderBoard();};
for(const th of document.querySelectorAll('[data-sort]'))th.onclick=()=>{const next=th.dataset.sort;sortDirection=next===sortKey?(sortDirection==='asc'?'desc':'asc'):['value','points'].includes(next)?'desc':'asc';sortKey=next;$('sort').value=next;renderBoard();};
renderHealth();renderBoard();renderCards();renderStrategy();setInterval(renderHealth,10000);
</script></body></html>
